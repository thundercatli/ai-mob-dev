name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      frp_version:
        description: "frp version tag to build frpc from (e.g. v0.70.1)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # libfrpc.so is not committed (see .gitignore); cross-compile it from frp's source with the
      # NDK toolchain so the APK ships a working frpc.
      # The script picks up ANDROID_NDK_LATEST_HOME, which GitHub-hosted runners already export.
      - name: Build embedded frpc
        env:
          FRP_VERSION: ${{ github.event.inputs.frp_version }}
        run: |
          if [ -z "${FRP_VERSION}" ]; then unset FRP_VERSION; fi
          ./scripts/build_frpc.sh

      # Optional: set the STORE_FILE_BASE64 / STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets to
      # sign with your own key. Without them the release build falls back to the debug key, so this
      # job still produces an installable APK.
      - name: Configure signing
        env:
          STORE_FILE_BASE64: ${{ secrets.STORE_FILE_BASE64 }}
        run: |
          if [ -n "$STORE_FILE_BASE64" ]; then
            echo "$STORE_FILE_BASE64" | base64 -d > release.jks
            echo "STORE_FILE=release.jks" >> "$GITHUB_ENV"
            echo "Signing with the keystore from secrets."
          else
            echo "No STORE_FILE_BASE64 secret set; the release build will use the debug key."
          fi

      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
