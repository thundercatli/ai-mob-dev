name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      frp_version:
        description: "frp version tag to build frpc from (e.g. v0.70.1)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed by the release step to create a release and upload the APK to it.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # libfrpc.so is not committed (see .gitignore); cross-compile it from frp's source with the
      # NDK toolchain so the APK ships a working frpc.
      # The script picks up ANDROID_NDK_LATEST_HOME, which GitHub-hosted runners already export.
      - name: Build embedded frpc
        env:
          FRP_VERSION: ${{ github.event.inputs.frp_version }}
        run: |
          if [ -z "${FRP_VERSION}" ]; then unset FRP_VERSION; fi
          ./scripts/build_frpc.sh

      # Optional: set the STORE_FILE_BASE64 / STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets to
      # sign with your own key. Without them the release build falls back to the debug key, so this
      # job still produces an installable APK.
      - name: Configure signing
        env:
          STORE_FILE_BASE64: ${{ secrets.STORE_FILE_BASE64 }}
        run: |
          if [ -n "$STORE_FILE_BASE64" ]; then
            echo "$STORE_FILE_BASE64" | base64 -d > release.jks
            echo "STORE_FILE=release.jks" >> "$GITHUB_ENV"
            echo "Signing with the keystore from secrets."
          else
            echo "No STORE_FILE_BASE64 secret set; the release build will use the debug key."
          fi

      # A crash in an Activity's own initialisation compiles cleanly and passes every static check,
      # then kills the app on every launch - which is exactly how v0.2.0 and v0.2.1 shipped. The only
      # thing that catches it is opening the app for real, so do that here, before the release step
      # below can publish anything.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # google_apis rather than the bare image: it translates arm64, and the APK only ever ships
          # an arm64 libfrpc.so (see the ndk abiFilters in app/build.gradle.kts).
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload smoke test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore

      # For a tag build, report the tag (without the leading "v") as the app's version, and use the
      # run number as versionCode so it always increases across releases.
      - name: Derive version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Name the APK after the build
        id: apk
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            name="ai-mob-dev-${GITHUB_REF_NAME}.apk"
          else
            name="ai-mob-dev-${GITHUB_SHA::7}.apk"
          fi
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # Publishes the APK on the Releases page so it can be downloaded without digging into the run.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
