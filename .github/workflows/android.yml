name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      frp_version:
        description: "frp version tag to build frpc from (e.g. v0.70.1)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # libfrpc.so is not committed (see .gitignore); cross-compile it from frp's source with the
      # NDK toolchain so the APK ships a working frpc.
      # The script picks up ANDROID_NDK_LATEST_HOME, which GitHub-hosted runners already export.
      - name: Build embedded frpc
        env:
          FRP_VERSION: ${{ github.event.inputs.frp_version }}
        run: |
          if [ -z "${FRP_VERSION}" ]; then unset FRP_VERSION; fi
          ./scripts/build_frpc.sh

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
